<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocketbook</title>
<meta name="theme-color" content="#15302F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocketbook">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC;--surface:#FFFFFF;--sunk:#E4E9E4;--ink:#15302F;--muted:#5B6E6B;--line:#D3DBD5;
  --in:#1F8A62;--out:#C2385A;--warn:#C98712;--accent:#2B5F8A;--accent-ink:#FFFFFF;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1819;--surface:#162425;--sunk:#1C2D2E;--ink:#E4EDE9;--muted:#90A4A0;--line:#27393A;
    --in:#4CC393;--out:#F0728E;--warn:#EDB24A;--accent:#7DB3E0;--accent-ink:#0E1819;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1819;--surface:#162425;--sunk:#1C2D2E;--ink:#E4EDE9;--muted:#90A4A0;--line:#27393A;
  --in:#4CC393;--out:#F0728E;--warn:#EDB24A;--accent:#7DB3E0;--accent-ink:#0E1819;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{padding:22px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
.brand{font:800 24px/1 var(--display);letter-spacing:-.02em;padding:0 10px 22px}
.brand small{display:block;font:500 12px var(--body);color:var(--muted);letter-spacing:0;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav .count{font-size:12px;background:var(--out);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.sync{margin:20px 10px 0;font-size:12px;color:var(--muted)}
main{padding:22px 32px 80px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font:700 30px/1.1 var(--display);letter-spacing:-.02em;margin:0;flex:1;min-width:160px}
.mswitch{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px}
.mswitch button{all:unset;cursor:pointer;padding:6px 12px;font-size:18px;line-height:1}
.mswitch span{min-width:110px;text-align:center;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--out)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input[type=checkbox]{accent-color:var(--accent)}
.muted{color:var(--muted)}
.pos{color:var(--in)}.neg{color:var(--out)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:end;padding:6px 0 28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.hero .k{margin:0;color:var(--muted);font-weight:500}
.big{font:800 clamp(44px,7vw,80px)/.95 var(--display);letter-spacing:-.035em;margin:8px 0}
.hero .sub{margin:0;color:var(--muted)}
.flow{display:grid;gap:10px}
.flow-row{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.track{height:34px;background:var(--sunk);border-radius:6px;overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .4s ease}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;padding-left:44px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font:700 18px/1.2 var(--display);margin:0 0 12px;letter-spacing:-.01em}
.panel h3{font-size:14px;margin:16px 0 6px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--in);border-radius:99px}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--out)}
.empty{color:var(--muted);padding:10px 0}
.scroll{overflow-x:auto}
.stack>*+*{margin-top:18px}
.chartwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.chartwrap ul{list-style:none;padding:0;margin:0;flex:1;min-width:150px;font-size:14px}
.chartwrap li{display:flex;align-items:center;gap:8px;padding:3px 0}
.chartwrap li b{margin-left:auto;font-weight:600}
svg text{fill:var(--muted);font:12px var(--body)}

/* transactions */
.quick{display:grid;grid-template-columns:auto 110px minmax(160px,1fr) auto;gap:8px;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted);margin:0 0 16px;min-height:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters input[type=search]{flex:1;min-width:180px}
.day{font-size:13px;color:var(--muted);font-weight:600;margin:16px 0 4px}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.tx .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tx .amt{font-weight:700;font-size:16px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--sunk);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--ink)}
.src{font-size:11px;border-radius:99px;padding:0 7px;border:1px solid var(--line);color:var(--muted)}
.src.you{border-color:var(--in);color:var(--in)}
.src.ai{border-color:var(--accent);color:var(--accent)}
.src.guess{border-color:var(--warn);color:var(--warn)}
.src.none{border-color:var(--out);color:var(--out)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,94vw)}
dialog::backdrop{background:rgba(10,20,20,.45)}
.dlg{padding:22px}
.dlg h2{font:700 22px var(--display);margin:0 0 16px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.fields .full{grid-column:1/-1}
.fields input,.fields select{color:var(--ink);font-weight:400;font-size:15px}
.catline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.splits{display:grid;gap:6px}
.splits .srow{display:grid;grid-template-columns:1fr 90px auto;gap:6px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.actions .left{margin-right:auto}

/* heatmap */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;max-width:420px}
.cal b{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal div{aspect-ratio:1;border-radius:6px;font-size:11px;padding:3px 5px;background:var(--sunk);color:var(--ink)}
.cal div.blank{background:none}
.compare td,.compare th{padding:6px 8px;text-align:right;white-space:nowrap}
.compare td:first-child,.compare th:first-child{text-align:left}
.compare{border-collapse:collapse;width:100%;font-size:14px}
.compare tr+tr td{border-top:1px solid var(--line)}
.compare th{font-size:12px;color:var(--muted)}
.flag{padding:8px 12px;border-left:3px solid var(--warn);background:var(--sunk);border-radius:0 8px 8px 0;margin:6px 0;font-size:14px}
.inboxrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,220px) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;font-weight:600;z-index:10;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
kbd{font:12px var(--body);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--sunk)}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:5;background:var(--surface);border-right:0;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .brand,.sync{display:none}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap;font-size:13px}
  main{padding:calc(16px + env(safe-area-inset-top)) 16px 90px}
  .hero{grid-template-columns:1fr;gap:16px}
  .quick{grid-template-columns:1fr 1fr}
  .quick input[name=qnote]{grid-column:1/-1}
  .fields{grid-template-columns:1fr}
  .tx{grid-template-columns:minmax(0,1fr) auto}
  .tx .edit{display:none}
  .inboxrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Pocketbook<small>Income and spending, sorted</small></div>
    <nav class="nav" id="nav"></nav>
    <p class="sync" id="sync">Saved on this device</p>
  </aside>
  <main>
    <header class="top">
      <h1 id="title">Dashboard</h1>
      <div class="mswitch" id="mswitch">
        <button data-act="prevm" aria-label="Previous month">‹</button>
        <span id="mlabel"></span>
        <button data-act="nextm" aria-label="Next month">›</button>
      </div>
      <button class="btn primary" data-act="new">Add transaction</button>
    </header>
    <div id="view"></div>
  </main>
</div>

<dialog id="txDlg">
  <form class="dlg" id="txForm" method="dialog" autocomplete="off">
    <h2 id="txTitle">Add transaction</h2>
    <div class="fields">
      <div class="full seg" role="radiogroup" aria-label="Type">
        <label><input type="radio" name="type" value="expense">Expense</label>
        <label><input type="radio" name="type" value="income">Income</label>
        <label><input type="radio" name="type" value="transfer">Transfer</label>
      </div>
      <label>Amount<input type="number" name="amount" step="0.01" min="0" required></label>
      <label>Currency<select name="currency"><option>CAD</option><option>HKD</option></select></label>
      <label class="full">What was it?<input type="text" name="note" placeholder="e.g. T&T Supermarket, Cathay flight, paycheque"></label>
      <label class="catf">Category<select name="category"></select></label>
      <label class="catf">Subcategory<select name="sub"></select></label>
      <div class="full catline catf"><span id="catBadge"></span><button type="button" class="link" data-act="aiOne" id="aiOneBtn" hidden>Ask AI to sort this</button></div>
      <label>Date<input type="date" name="date" required></label>
      <label><span id="acctLabel">Account</span><select name="account"></select></label>
      <label class="tof">To account<select name="toAccount"></select></label>
      <label class="full">Tags<input type="text" name="tags" placeholder="#school #trip"></label>
      <div class="full catf">
        <label class="row" style="flex-direction:row;color:var(--ink)"><input type="checkbox" name="split"> Split across categories</label>
        <div class="splits" id="splits" hidden></div>
      </div>
      <label class="full row newonly" style="flex-direction:row;color:var(--ink);font-weight:500"><input type="checkbox" name="repeat"> Repeat monthly on this day</label>
      <p class="full muted" id="tripNote" style="margin:0;font-size:13px" hidden></p>
    </div>
    <div class="actions">
      <button type="button" class="btn danger left" data-act="delTx" id="delBtn">Delete</button>
      <button type="button" class="btn" data-act="closeDlg">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>
<input type="file" id="fileIn" hidden>
<div class="toast" id="toast" role="status"></div>

function normalize(o){

function commit(months=[],meta=true){
  months.forEach(m=>m&&dirtyMonths.add(m));if(meta)dirtyMeta=true;

function metaRef(){return db.doc(`data/users/${uid}/ledger`)}
async function flush(){
  if(!db||!uid)return;
  try{
    setSync('Saving…');
    if(dirtyMeta){dirtyMeta=false;const{tx,...meta}=state;await metaRef().set(clone(meta))}
    for(const m of[...dirtyMonths]){
      dirtyMonths.delete(m);
      const items=state.tx.filter(t=>ym(t.date)===m);
      const ref=metaRef().collection('months').doc(m);
      if(items.length)await ref.set({items:clone(items)});else await ref.delete();
    }
    setSync('Saved to your account');
  }catch(e){
    if(e&&e.code==='quota_exceeded')setSync('Storage is full. Export a backup and delete old months.');
    else setSync('Saved on this device. Sync will retry on your next change.');
  }
}

/* ---------- money ---------- */
function rate(c){const b=state.settings.base,r=+state.settings.hkdRate||1;if(c===b)return 1;if(c==='HKD'&&b==='CAD')return 1/r;if(c==='CAD'&&b==='HKD')return r;return 1}
const fmt=(n,c)=>new Intl.NumberFormat('en-CA',{style:'currency',currency:c||state.settings.base,maximumFractionDigits:2}).format(n||0);
const fmt0=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:state.settings.base,maximumFractionDigits:0}).format(n||0);
const base=t=>t.amount*rate(t.currency);
function parts(t){
  const r=rate(t.currency);
  if(t.splits&&t.splits.length)return t.splits.map(s=>({category:s.category||'Uncategorized',sub:s.sub||'',amount:(+s.amount||0)*r}));
  return[{category:t.category||'Uncategorized',sub:t.sub||'',amount:t.amount*r}];
}
function totals(m){
  const o={inc:0,exp:0,byCat:{},bySub:{},byInc:{}};
  for(const t of state.tx){
    if(m&&ym(t.date)!==m)continue;
    if(t.type==='income'){o.inc+=base(t);o.byInc[t.category]=(o.byInc[t.category]||0)+base(t)}
    else if(t.type==='expense'){o.exp+=base(t);for(const p of parts(t)){o.byCat[p.category]=(o.byCat[p.category]||0)+p.amount;const k=p.category+(p.sub?' › '+p.sub:'');o.bySub[k]=(o.bySub[k]||0)+p.amount}}
  }
  return o;
}
function catColor(c){const keys=Object.keys(state.categories.expense);const i=keys.indexOf(c);return c==='Uncategorized'?'#8C9794':PALETTE[(i<0?keys.length:i)%PALETTE.length]}

/* ---------- auto-categorize ---------- */
const mkey=s=>String(s||'').toLowerCase().replace(/[0-9#*]+/g,' ').replace(/[^a-z&'\-+. ]/g,' ').replace(/\s+/g,' ').trim().split(' ').slice(0,3).join(' ');
function suggest(note,type){
  if(type==='transfer')return null;
  const n=String(note||'').toLowerCase();if(!n.trim())return null;
  for(const r of state.rules)if(r.type===type&&r.match&&n.includes(r.match.toLowerCase()))return{category:r.category,sub:r.sub,source:'rule'};
  const L=state.learned[type+':'+mkey(note)];if(L)return{...L,source:'learned'};
  for(const[k,ty,c,s]of KEYWORDS){
    if(ty!==type)continue;
    const re=new RegExp('(^|[^a-z])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^a-z])');
    if(re.test(n)&&state.categories[type][c])return{category:c,sub:(state.categories[type][c]||[]).includes(s)?s:'',source:'keyword'};
  }
  return null;
}
function learn(note,type,category,sub){
  const k=mkey(note);if(!k||type==='transfer'||!category||category==='Uncategorized')return;
  state.learned[type+':'+k]={category,sub:sub||''};
}
const SRC={you:['you','Set by you'],rule:['','Your rule'],learned:['','Learned'],keyword:['guess','Auto'],ai:['ai','AI'],none:['none','Needs sorting']};
function srcBadge(t){if(t.type==='transfer')return'';const s=isInbox(t)?'none':(t.source||'you');const[c,l]=SRC[s]||SRC.you;return `<span class="src ${c}">${l}</span>`}
const isInbox=t=>t.type!=='transfer'&&(!t.category||t.category==='Uncategorized')&&!(t.splits&&t.splits.length);

function catListText(){
  const f=ty=>Object.entries(state.categories[ty]).map(([c,s])=>`${c}${s.length?': '+s.join(', '):''}`).join('\n');
  return `Spending categories:\n${f('expense')}\n\nIncome categories:\n${f('income')}`;
}
async function aiSort(items){
  if(!sampleFn)throw{code:'not_granted'};
  const prompt=`You sort personal finance transactions for a university student who lives in Vancouver, Canada and spends time in Hong Kong. Use ONLY the categories and subcategories listed. Pick a subcategory when one fits, else use "".

${catListText()}

Transactions (index | type | description | amount):
${items.map((t,i)=>`${i} | ${t.type} | ${t.note||'(no description)'} | ${t.amount} ${t.currency}`).join('\n')}

Reply with only a JSON array, one object per transaction, like:
[{"i":0,"category":"Food","sub":"Coffee"}]
If you truly cannot tell, use "Uncategorized" for category.`;
  const out=await sampleFn.json(prompt,{modelTier:'quick'});
  if(!Array.isArray(out))return[];
  return out.map(r=>{
    const t=items[r.i];if(!t)return null;
    const cats=state.categories[t.type]||{};
    if(!cats[r.category])return null;
    return{t,category:r.category,sub:(cats[r.category]||[]).includes(r.sub)?r.sub:''};
  }).filter(Boolean);
}

/* ---------- recurring ---------- */
function nextDue(r){const m=r.through?nextYm(r.through):r.start;return `${m}-${pad(Math.min(r.day,daysIn(m)))}`}
function runRecurring(){
  const today=todayStr(),touched=[];
  for(const r of state.recurring){
    let guard=0;
    while(guard++<36){
      const due=nextDue(r);if(due>today)break;
      state.tx.push({id:newId(),type:r.type,amount:r.amount,currency:r.currency,date:due,note:r.note,category:r.category,sub:r.sub,account:r.account,toAccount:r.toAccount||'',tags:r.tags||[],source:'you',recurringId:r.id});
      r.through=ym(due);touched.push(ym(due));
    }
  }
  if(touched.length)commit(touched);
}

/* ---------- charts ---------- */
function donut(entries,total){
  const r=58,C=2*Math.PI*r;let off=0;
  const segs=entries.map(([c,v])=>{const len=total?v/total*C:0;const s=`<circle r="${r}" cx="80" cy="80" fill="none" stroke="${catColor(c)}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"><title>${esc(c)}: ${fmt(v)}</title></circle>`;off+=len;return s}).join('');
  return `<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Spending by category"><g transform="rotate(-90 80 80)"><circle r="${r}" cx="80" cy="80" fill="none" stroke="var(--sunk)" stroke-width="26"/>${segs}</g><text x="80" y="76" text-anchor="middle">Spent</text><text x="80" y="95" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:15px">${fmt0(total)}</text></svg>`;
}
function barsSvg(months){
  const data=months.map(m=>({m,...totals(m)}));
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const W=460,H=190,pb=24,bw=18,gap=W/data.length;
  const bars=data.map((d,i)=>{const x=i*gap+gap/2;const hi=(H-pb-10)*d.inc/max,he=(H-pb-10)*d.exp/max;
    return `<rect x="${x-bw-2}" y="${H-pb-hi}" width="${bw}" height="${hi}" rx="3" fill="var(--in)"><title>${mLabel(d.m)} income ${fmt(d.inc)}</title></rect><rect x="${x+2}" y="${H-pb-he}" width="${bw}" height="${he}" rx="3" fill="var(--out)"><title>${mLabel(d.m)} spending ${fmt(d.exp)}</title></rect><text x="${x}" y="${H-6}" text-anchor="middle">${mLabel(d.m,true)}</text>`}).join('');
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px;max-height:220px" role="img" aria-label="Income and spending, last six months"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${bars}</svg></div><div class="row muted" style="font-size:13px"><span class="dot" style="background:var(--in)"></span>Income <span class="dot" style="background:var(--out)"></span>Spending</div>`;
}

function pace(m,spent,limit){
  const today=todayStr();if(ym(today)!==m)return '';

  return `<p class="muted" style="margin:6px 0 0;font-size:13px">At this pace you'll spend about ${fmt0(proj)} this month${limit&&proj>limit?`, ${fmt0(proj-limit)} over`:''}.</p>`;
}

function vTransactions(){

  let inc=0,exp=0;list.forEach(t=>{if(t.type==='income')inc+=base(t);else if(t.type==='expense')exp+=base(t)});

  <form class="quick" id="quick" autocomplete="off">

    <select id="fcat" aria-label="Category"><option value="">All categories</option>${allCats.map(c=>`<option${F.cat===c?' selected':''}>${esc(c)}</option>`).join('')}</select>
    <select id="fscope" aria-label="Period"><option value="month"${F.scope==='month'?' selected':''}>${mLabel(cur)}</option><option value="all"${F.scope==='all'?' selected':''}>All time</option></select>

  <div class="spread muted" style="font-size:14px"><span>${list.length} transaction${list.length===1?'':'s'}</span><span><span class="pos">${fmt(inc)}</span> in, <span class="neg">${fmt(exp)}</span> out</span></div>

  </div></div>`;
}

function goalEta(g){
  const left=g.target-g.saved;if(left<=0)return 'Reached';
  const since=new Date();since.setMonth(since.getMonth()-3);
  const s=since.toISOString().slice(0,10);
  const recent=(g.history||[]).filter(h=>h.date>=s).reduce((a,h)=>a+h.amount,0);
  const perMonth=recent/3;
  let txt=perMonth>0?`About ${Math.ceil(left/perMonth)} month${Math.ceil(left/perMonth)>1?'s':''} to go at ${fmt0(perMonth)}/month`:'Add money to see an estimate';
  if(g.deadline){const months=Math.max(1,Math.round(dayDiff(todayStr(),g.deadline)/30.4));txt+=`. To hit ${new Date(g.deadline+'T00:00').toLocaleDateString('en-CA',{month:'short',year:'numeric'})}, save ${fmt0(left/months)}/month`}
  return txt;
}
function vGoals(){

function vRecurring(){

  <span class="row"><b class="${r.type==='income'?'pos':''}">${fmt(r.amount,r.currency)}</b><button class="btn small danger" data-act="delRec" data-id="${r.id}">Stop</button></span></div>`}).join(''):'<p class="empty">No monthly transactions yet.</p>'}</div>`;

function acctBalance(a){
  let b=+a.opening||0;
  for(const t of state.tx){const v=base(t);
    if(t.type==='income'&&t.account===a.id)b+=v;
    else if(t.type==='expense'&&t.account===a.id)b-=v;
    else if(t.type==='transfer'){if(t.account===a.id)b-=v;if(t.toAccount===a.id)b+=v}}
  return b;
}
function vAccounts(){
  const total=state.accounts.reduce((s,a)=>s+acctBalance(a),0);
  return `<div class="stack">

function vInsights(){
  const T=totals(cur),P=totals(prevYm(cur));
  const cats=[...new Set([...Object.keys(T.byCat),...Object.keys(P.byCat)])].sort((a,b)=>(T.byCat[b]||0)-(T.byCat[a]||0));
  // spikes vs prior 3 months
  const prior=[prevYm(cur),prevYm(prevYm(cur)),prevYm(prevYm(prevYm(cur)))].map(totals);
  const spikes=Object.entries(T.byCat).map(([c,v])=>{const vals=prior.map(p=>p.byCat[c]||0).filter(x=>x>0);const avg=vals.length>=2?vals.reduce((a,b)=>a+b,0)/vals.length:0;return{c,v,avg,x:avg?v/avg:0}}).filter(s=>s.avg>0&&s.x>=1.8&&s.v-s.avg>20).sort((a,b)=>b.x-a.x);
  // calendar
  const dim=daysIn(cur),first=new Date(cur+'-01T00:00').getDay();
  const byDay={};state.tx.forEach(t=>{if(t.type==='expense'&&ym(t.date)===cur)byDay[+t.date.slice(8)]=(byDay[+t.date.slice(8)]||0)+base(t)});
  const maxDay=Math.max(1,...Object.values(byDay));
  let cal=['S','M','T','W','T','F','S'].map(d=>`<b>${d}</b>`).join('')+'<div class="blank"></div>'.repeat(first);
  for(let d=1;d<=dim;d++){const v=byDay[d]||0,p=Math.round(v/maxDay*85);cal+=`<div style="${v?`background:color-mix(in srgb,var(--out) ${Math.max(p,12)}%,var(--sunk));color:${p>50?'#fff':'var(--ink)'}`:''}" title="${d}: ${fmt(v)}">${d}</div>`}
  // merchants
  const mer={};state.tx.forEach(t=>{if(t.type!=='expense'||!t.note)return;const k=mkey(t.note);if(!k)return;mer[k]=mer[k]||{name:t.note,n:0,v:0};mer[k].n++;mer[k].v+=base(t)});
  const topM=Object.values(mer).sort((a,b)=>b.n-a.n||b.v-a.v).slice(0,8);
  // year
  const yr=cur.slice(0,4);const yt=state.tx.filter(t=>t.date.startsWith(yr));
  let yi=0,ye=0,big=null;const mm={};
  yt.forEach(t=>{const v=base(t);if(t.type==='income'){yi+=v;mm[ym(t.date)]=(mm[ym(t.date)]||0)+v}else if(t.type==='expense'){ye+=v;mm[ym(t.date)]=(mm[ym(t.date)]||0)-v;if(!big||v>base(big))big=t}});
  const best=Object.entries(mm).sort((a,b)=>b[1]-a[1])[0];
  // trips
  const trips={};state.tx.forEach(t=>{if(t.trip&&t.type==='expense')trips[t.trip]=(trips[t.trip]||0)+base(t)});
  const subs=Object.entries(T.bySub).sort((a,b)=>b[1]-a[1]);
  const dToday=ym(todayStr())===cur?+todayStr().slice(8):dim;
  return `<div class="grid">
  <div class="panel wide"><h2>${mLabel(cur)} vs ${mLabel(prevYm(cur))}</h2>
    ${spikes.map(s=>`<div class="flag"><b>${esc(s.c)}</b> is ${s.x.toFixed(1)}x your usual (${fmt0(s.v)} vs about ${fmt0(s.avg)} a month).</div>`).join('')}
    ${cats.length?`<div class="scroll"><table class="compare"><tr><th>Category</th><th>This month</th><th>Last month</th><th>Change</th></tr>${cats.map(c=>{const a=T.byCat[c]||0,b=P.byCat[c]||0;const ch=b?Math.round((a-b)/b*100):null;return `<tr><td><span class="row" style="gap:6px"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)}</span></td><td>${fmt0(a)}</td><td class="muted">${fmt0(b)}</td><td class="${ch>0?'neg':ch<0?'pos':'muted'}">${ch===null?'new':(ch>0?'+':'')+ch+'%'}</td></tr>`}).join('')}</table></div>`:'<p class="empty">No spending to compare yet.</p>'}
  </div>
  <div class="panel"><h2>Daily spending</h2><div class="cal">${cal}</div>
    <div class="kv" style="margin-top:14px"><span class="muted">Average per day</span><b>${fmt(T.exp/Math.max(1,dToday))}</b>${ym(todayStr())===cur?`<span class="muted">Projected month end</span><b>${fmt0(T.exp/dToday*dim)}</b>`:''}<span class="muted">Biggest day</span><b>${Object.keys(byDay).length?fmt(maxDay):'—'}</b></div></div>
  <div class="panel"><h2>Detailed breakdown</h2>${subs.length?subs.slice(0,12).map(([k,v])=>`<div class="spread" style="padding:3px 0"><span>${esc(k)}</span><b>${fmt0(v)}</b></div><div class="bar" style="height:5px;margin:0 0 4px"><i style="width:${v/subs[0][1]*100}%;background:${catColor(k.split(' › ')[0])}"></i></div>`).join(''):'<p class="empty">Nothing yet.</p>'}</div>
  <div class="panel"><h2>Where you spend most often</h2>${topM.length?topM.map(m=>`<div class="spread" style="padding:4px 0"><span>${esc(m.name)} <span class="muted">${m.n}×</span></span><b>${fmt0(m.v)}</b></div>`).join(''):'<p class="empty">Add descriptions to your transactions to see this.</p>'}</div>
  <div class="panel"><h2>${yr} so far</h2><div class="kv"><span class="muted">Earned</span><b class="pos">${fmt0(yi)}</b><span class="muted">Spent</span><b class="neg">${fmt0(ye)}</b><span class="muted">Saved</span><b>${fmt0(yi-ye)}</b><span class="muted">Biggest expense</span><b>${big?esc(big.note||big.category)+' '+fmt0(base(big)):'—'}</b><span class="muted">Best saving month</span><b>${best?mLabel(best[0])+' ('+fmt0(best[1])+')':'—'}</b></div></div>
  <div class="panel"><h2>Trips</h2>${Object.keys(trips).length?Object.entries(trips).map(([k,v])=>`<div class="spread" style="padding:4px 0"><span>${esc(k)}</span><b>${fmt0(v)}</b></div>`).join(''):'<p class="empty">Turn on trip mode in Settings before you travel, and everything you log gets tagged to that trip.</p>'}</div>
  </div>`;
}

  <div class="panel"><h2>Categories</h2>

    ${['expense','income'].map(ty=>`<h3>${ty==='expense'?'Spending':'Income'}</h3>`+Object.entries(state.categories[ty]).map(([c,subs])=>`<div class="spread" style="padding:6px 0;border-top:1px solid var(--line);align-items:center"><span class="row" style="gap:6px"><span class="dot" style="background:${ty==='expense'?catColor(c):'var(--in)'}"></span><b>${esc(c)}</b> ${subs.map(s=>`<span class="chip">${esc(s)} <button class="link" style="color:var(--muted)" data-act="delSub" data-type="${ty}" data-cat="${esc(c)}" data-sub="${esc(s)}" aria-label="Remove ${esc(s)}">×</button></span>`).join('')}</span>
      <span class="row"><input type="text" placeholder="Add sub" style="width:110px;padding:4px 8px" data-subin="${ty}|${esc(c)}" aria-label="New subcategory for ${esc(c)}"><button class="btn small" data-act="addSub" data-type="${ty}" data-cat="${esc(c)}">Add</button>${state.tx.some(t=>t.category===c)?'':`<button class="btn small danger" data-act="delCat" data-type="${ty}" data-cat="${esc(c)}">Delete</button>`}</span></div>`).join('')).join('')}

function render(){
  document.documentElement.toggleAttribute('data-theme',state.settings.theme!=='auto');
  if(state.settings.theme!=='auto')document.documentElement.dataset.theme=state.settings.theme;
  renderNav();
  $('#title').textContent=VIEWS.find(v=>v[0]===view)[1];
  $('#mlabel').textContent=mLabel(cur);
  $('#mswitch').style.visibility=['dashboard','transactions','budgets','insights'].includes(view)?'visible':'hidden';

async function doDownload(filename,data){
  if(!downloads){
    try{const url=URL.createObjectURL(new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'application/json'}));
      const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);toast('File saved')}
    catch(e){toast('Downloads aren\'t available here.')}
    return}
  try{await downloads.save({filename,data});toast('File saved')}catch(e){if(e&&e.code!=='declined')toast('The file couldn\'t be saved.')}
}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);if(row.some(x=>x.trim()))rows.push(row);row=[];f=''}else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
function normDate(s){
  s=String(s||'').trim();let m;
  if((m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))){const a=+m[1],b=+m[2];return a>12?`${m[3]}-${pad(b)}-${pad(a)}`:`${m[3]}-${pad(a)}-${pad(b)}`}
  const d=new Date(s);return isNaN(d)?null:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
const num=s=>{s=String(s||'').replace(/[$,\s]/g,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);return parseFloat(s)};
function importCsv(text){
  const rows=parseCSV(text);if(rows.length<2){toast('That file has no rows to import.');return}
  const h=rows[0].map(x=>x.toLowerCase().trim());
  const find=re=>h.findIndex(x=>re.test(x));
  const di=find(/date/),ni=find(/desc|merchant|name|payee|detail|memo|note|transaction/),ai=find(/^amount|amount/),dbi=find(/debit|withdraw|money out|paid out/),cri=find(/credit|deposit|money in|paid in/);
  if(di<0||(ai<0&&dbi<0&&cri<0)){toast('Couldn\'t find date and amount columns in that file.');return}
  const months=new Set();let n=0,unsorted=0;
  for(const r of rows.slice(1)){
    const date=normDate(r[di]);if(!date)continue;
    let v;
    if(ai>=0)v=num(r[ai]);else{const d=num(r[dbi]),c=num(r[cri]);v=(c>0?c:0)-(d>0?d:0)}
    if(!v||isNaN(v))continue;
    const type=v<0?'expense':'income',note=(ni>=0?r[ni]:'').trim();
    const s=suggest(note,type);
    state.tx.push({id:newId(),type,amount:Math.abs(v),currency:state.settings.base,date,note,category:s?s.category:'Uncategorized',sub:s?s.sub:'',account:state.accounts[0].id,toAccount:'',tags:['imported'],source:s?s.source:'none'});
    months.add(ym(date));n++;if(!s)unsorted++;
  }
  commit([...months]);toast(`Imported ${n} transactions${unsorted?`, ${unsorted} need sorting`:''}`);
}
let fileMode='';
$('#fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const text=await f.text();
  if(fileMode==='csv')importCsv(text);
  else{
    try{const o=JSON.parse(text);if(!o||!Array.isArray(o.tx))throw 0;
      const old=new Set(state.tx.map(t=>ym(t.date)));state=normalize(o);state.tx.forEach(t=>old.add(ym(t.date)));
      commit([...old]);toast(`Restored ${state.tx.length} transactions`)}
    catch(err){toast('That file isn\'t a Pocketbook backup.')}
  }
});

      if(armed!=='del'){armed='del';b.textContent='Click again to delete';return}
      armed=null;state.tx=state.tx.filter(t=>t.id!==editing.id);dlg.close();commit([ym(editing.date)]);toast('Transaction deleted');break;

        if(res[0]){catTouched=false;lastSug={source:'ai'};fillCats(res[0].category,res[0].sub);syncDlg();catTouched=false}else toast('AI couldn\'t place this one. Pick a category yourself.');

        const got=res.filter(r=>r.category!=='Uncategorized').length;commit([...months]);toast(`AI sorted ${got} of ${items.length}. Look for the AI badge to double-check.`);
      }catch(err){toast(aiErr(err));render()}

    case 'delGoal':state.goals=state.goals.filter(g=>g.id!==id);commit();break;

      if(!(a>0)){toast('Enter an amount.');inp.focus();return}

      commit();toast(g.saved>=g.target?`${g.name} reached!`:'Goal updated');break}
    case 'delRec':state.recurring=state.recurring.filter(r=>r.id!==id);commit();toast('Stopped. Past transactions are kept.');break;
    case 'delAcct':state.accounts=state.accounts.filter(a=>a.id!==id);commit();break;
    case 'delRule':state.rules=state.rules.filter(r=>r.id!==id);commit();break;
    case 'applyRules':{const months=new Set();let n=0;
      state.tx.forEach(t=>{if(t.type==='transfer'||t.source==='you'||t.splits)return;const s=suggest(t.note,t.type);if(s&&s.source==='rule'&&(s.category!==t.category||s.sub!==t.sub)){t.category=s.category;t.sub=s.sub;t.source='rule';months.add(ym(t.date));n++}});
      commit([...months]);toast(`${n} transaction${n===1?'':'s'} re-sorted`);break}
    case 'forget':delete state.learned[b.dataset.key];commit();break;
    case 'addCat':{const ty=$('#newCatType').value,nm=$('#newCatName').value.trim();
      if(!nm)return;if(state.categories[ty][nm]){toast('That category already exists.');return}
      state.categories[ty][nm]=[];commit();toast(`${nm} added`);break}
    case 'delCat':delete state.categories[b.dataset.type][b.dataset.cat];delete state.catBudgets[b.dataset.cat];commit();break;
    case 'addSub':{const ty=b.dataset.type,c=b.dataset.cat,inp=[...document.querySelectorAll('[data-subin]')].find(x=>x.dataset.subin===ty+'|'+c),nm=inp.value.trim();
      if(!nm)return;const arr=state.categories[ty][c];if(!arr.includes(nm))arr.push(nm);commit();break}
    case 'delSub':{const arr=state.categories[b.dataset.type][b.dataset.cat];state.categories[b.dataset.type][b.dataset.cat]=arr.filter(s=>s!==b.dataset.sub);commit();break}
    case 'importCsv':fileMode='csv';$('#fileIn').accept='.csv,text/csv';$('#fileIn').click();break;
    case 'restore':fileMode='json';$('#fileIn').accept='.json,application/json';$('#fileIn').click();break;
    case 'exportCsv':{
      const lines=[['date','type','amount','currency',`amount_${state.settings.base}`,'category','subcategory','description','account','to_account','tags','trip','sorted_by']];
      sorted(state.tx).reverse().forEach(t=>{
        const rows=t.splits&&t.splits.length?t.splits.map(s=>({...t,amount:s.amount,category:s.category,sub:s.sub})):[t];
        rows.forEach(r=>lines.push([r.date,r.type,r.amount,r.currency,(r.amount*rate(r.currency)).toFixed(2),r.category,r.sub,r.note,acctName(r.account),r.toAccount?acctName(r.toAccount):'',(r.tags||[]).join(' '),r.trip||'',r.source||'']))});
      doDownload(`pocketbook-${todayStr()}.csv`,lines.map(l=>l.map(csvCell).join(',')).join('\n'));break}

    case 'wipe':
      if(armed!=='wipe'){armed='wipe';render();return}

  if(e.key==='n'||e.key==='N'){e.preventDefault();openTx(null)}
  else if(e.key==='/'){e.preventDefault();view='transactions';render();$('#fq').focus()}
  else if(e.key==='ArrowLeft'){cur=prevYm(cur);render()}
  else if(e.key==='ArrowRight'){cur=nextYm(cur);render()}
});
dlg.addEventListener('close',()=>{armed=null;render()});

runRecurring();
render();
initRemote();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
